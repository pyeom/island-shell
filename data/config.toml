# island-shell configuration
#
# Copy to ~/.config/island-shell/config.toml. Changes apply on save.
# Every key is optional; the values below are the defaults.

[island]
# Pill size in its resting state. The compact pill grows to fit its content.
compact_width = 190
compact_height = 36
# Extra size while the pointer hovers ("peek").
peek_extra_width = 40
peek_extra_height = 6
# Fallback size for expanded activities that do not declare their own.
expanded_width = 420
expanded_height = 200
expanded_radius = 34
# Gap between the top of the screen and the pill.
top_margin = 6
# Space reserved for the island at the top of every monitor. Windows are laid
# out below it; the expanded island floats over them.
exclusive_zone = 44
# Size of the transparent layer surface the island animates inside. It never
# resizes, so it must fit the largest state (raised automatically if not).
surface_width = 600
surface_height = 560
# With a fullscreen window (games, videos) on the monitor:
#   "minimal": hide the clock, media and privacy; notifications, OSD and
#              other alerts still show
#   "hide":    hide everything except critical notifications and what you
#              open yourself (launcher, power menu, islandctl expand)
#   "show":    no change
fullscreen = "minimal"

[animations]
# "full" (springs), "reduced" (no bounce) or "off".
mode = "full"

[theme]
# "static" or "pywal" (reads ~/.cache/wal/colors.json and follows changes).
source = "static"
# "black" (solid, like iOS) or "blur" (translucent; also add the layerrule
# from docs/activities.md so Hyprland blurs what is behind the island).
style = "black"
# Accent color for progress bars, toggles, etc.
accent = "#0a84ff"
# With source = "pywal": which pywal color to use as accent.
pywal_accent = "color4"
# With style = "blur": fill opacity of the pill.
blur_opacity = 0.6
# Icon theme name; empty uses the Qt platform theme, then kdeglobals, then GTK.
icon_theme = ""

[clock]
# Qt time format: "HH:mm" (24h), "h:mm AP" (12h), "HH:mm:ss", ...
format = "HH:mm"

[notifications]
# How long a popup stays (ms) when the app does not say. Critical
# notifications stay until dismissed.
timeout = 5000
# Notifications kept in history (shown in the expanded idle view).
history_limit = 100
# Per-app rules, first match wins. `app` matches the app name or its desktop
# entry, case-insensitive, with * wildcards.
#   mute     = true                 drop it entirely
#   no_popup = true                 history only
#   urgency  = "low" | "normal" | "critical"
# With do-not-disturb (islandctl dnd on) only critical ones pop up.
rules = [
  # { app = "discord", no_popup = true },
  # { app = "*spotify*", mute = true },
]

[launcher]
# Terminal for Terminal=true apps; empty tries $TERMINAL, kitty, alacritty, foot.
terminal = ""
# Prepended to every launch command, e.g. "uwsm app --" for uwsm sessions.
launch_prefix = ""
# Web search for "?words" in the launcher; %s is replaced by the query.
search_url = "https://duckduckgo.com/?q=%s"

[calendar]
# vdir collections (what vdirsyncer writes) or any folders of .ics files,
# searched recursively. Sync with Google, iCloud, Nextcloud... is up to
# vdirsyncer; see README.
paths = ["~/.calendars", "~/.local/share/calendars"]
# How many days ahead to expand events.
days = 60
# Show an upcoming event in the island this many minutes before it starts
# (0 disables).
reminder_minutes = 10

[system]
# Alert when a temperature stays at or above these for 10 s (°C, 0 disables).
cpu_hot = 90
gpu_hot = 95
nvme_hot = 70

[weather]
# City for the forecast (Open-Meteo, no account needed). Empty disables it.
# Only the city name is sent for geocoding; its coordinates are cached.
city = ""
units = "metric"          # metric | imperial
# Alert when rain is at least this likely within 2 hours (%, 0 disables).
rain_alert = 60

[night_light]
# Command that starts the night light. Empty: turning it off remembers how
# wlsunset was running (with your coordinates) and reuses that.
command = ""

[power]
lock_command = "hyprlock"
# Press-and-hold time for shut down and restart (ms).
hold_ms = 800

# Settings for activities live under [activities.<name>] and are read with
# Config.get("activities.<name>.<key>", default).
#
# [activities.pomodoro]
# minutes = 25
